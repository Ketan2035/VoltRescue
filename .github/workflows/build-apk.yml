name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🟢 Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: 📦 Install Client Dependencies
        working-directory: ./client
        run: npm ci || npm install

      - name: ⚙️ Generate Native Android Project (Expo Prebuild)
        working-directory: ./client
        run: npx expo prebuild --platform android --clean

      - name: 🔑 Configure Release Signing with Debug Keystore
        working-directory: ./client/android
        run: |
          node -e "
            const fs = require('fs');
            const file = 'app/build.gradle';
            let c = fs.readFileSync(file, 'utf8');
            c = c.replace(/\/\/\s*signingConfig\s+signingConfigs\.release/g, 'signingConfig signingConfigs.debug');
            c = c.replace(/signingConfig\s+signingConfigs\.release/g, 'signingConfig signingConfigs.debug');
            fs.writeFileSync(file, c);
            console.log('✅ Updated app/build.gradle for standalone release build');
          "

      - name: 🔨 Build Standalone Release APK via Gradle
        working-directory: ./client/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: 🚀 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoltRescue-Standalone-APK
          path: client/android/app/build/outputs/apk/release/*.apk
