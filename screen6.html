<script>
        // Micro-interaction for Van movement simulation
        const van = document.getElementById('van-marker');
        const progress = document.getElementById('progress-line');
        
        let moveCount = 0;
        const animateVan = () => {
            const xOffset = Math.sin(moveCount * 0.1) * 20;
            const yOffset = Math.cos(moveCount * 0.1) * 20;
            
            // Subtle movement simulation
            van.style.transform = `translate(${xOffset}px, ${yOffset}px)`;
            
            moveCount++;
            requestAnimationFrame(animateVan);
        };
        
        // Start simple loop
        animateVan();

        // Interaction Feedback
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('click', () => {
                const originalScale = btn.style.transform;
                btn.style.transform = 'scale(0.9)';
                setTimeout(() => {
                    btn.style.transform = originalScale;
                }, 100);
            });
        });
    </script>
