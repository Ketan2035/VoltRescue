<body class="bg-background text-on-surface selection:bg-secondary-fixed selection:text-on-secondary-fixed font-body-md overflow-hidden">
<!-- Splash/Onboarding Canvas -->
<main class="relative h-screen w-full flex flex-col justify-end items-center overflow-hidden">
<!-- Background Hero Image -->

<div class="w-full h-full hero-gradient absolute inset-0 z-10"></div>
<img class="w-full h-full object-cover object-center scale-105 transition-transform duration-10000 ease-linear" data-alt="A cinematic, high-end photography of a futuristic mobile electric vehicle charging van parked in a minimalist, dimly lit obsidian-textured urban environment. The vehicle features sleek, aerodynamic lines and integrated LED light bars in neon green and electric blue. The atmosphere is sophisticated and powerful, emphasizing a premium automotive aesthetic with high contrast and sharp focus. Soft, ambient glares reflect off the polished surfaces of the van, creating a sense of advanced engineering and clean energy reliability." id="heroImage" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCtEZTrUDcljv0zCFvMkdksLchO5RUYzfKGpNG2GsmLWdBE_h4hc5Fl5Uj8vuYmd6NiKeL3lmwtJqjJfW5ksylJTfpS_Xpz6fdYpbJ-zyMPqCPS7ERcBkqvN9imGPezfbOGdQq9rGYDEuu-DqQAGXRpfwT0XleqfzZotpCaJJcQ_2L4o-6y71r5GrgIIwZeD8y8j5ojHxixZ9ywII3EHxRZ9fJv0-kY5VQ_OEadmGLfwFSzj_PB0nNWmeobr0Bc__1cb2TFcIVgBHqJ" style="transform: scale(1.15);">
</div>
<!-- Brand Logo (Subtle Placement) -->
<div class="absolute top-12 left-1/2 -translate-x-1/2 z-20 flex flex-col items-center gap-2">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-secondary-fixed text-4xl" data-weight="fill">battery_charging_full</span>
<h1 class="font-display-lg-mobile text-display-lg-mobile md:font-display-lg md:text-display-lg text-primary tracking-tighter">VoltRescue</h1>
</div>
<div class="h-[1px] w-12 bg-secondary-fixed opacity-50"></div>
</div>
<!-- Content Overlay -->
<div class="relative z-20 w-full max-w-xl px-margin-mobile pb-24 md:pb-32 flex flex-col items-center text-center">
<!-- Headline Cluster -->
<div class="mb-10 space-y-4">
<h2 class="font-display-lg-mobile text-display-lg-mobile md:font-display-lg md:text-display-lg text-white leading-tight">
                    Charging, Wherever <br class="hidden md:block"> You Are.
                </h2>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-sm mx-auto opacity-90">
                    The world's first mobile EV charging network at your fingertips.
                </p>
</div>
<!-- Action Area -->
<div class="w-full flex flex-col items-center gap-6">
<button class="animate-pulse-glow group relative overflow-hidden bg-secondary-fixed text-on-secondary-fixed px-10 py-5 rounded-full font-headline-md text-headline-md transition-all active:scale-95 flex items-center gap-3" onclick="startOnboarding()">
<span class="">Get Started</span>
<span class="material-symbols-outlined transition-transform group-hover:translate-x-1">arrow_forward</span>
</button>
<button class="text-tertiary font-label-sm text-label-sm hover:text-white transition-colors tracking-widest uppercase py-2">
                    Already a member? Sign In
                </button>
</div>
<!-- Visual Decorative Element (Progress indicator simulation) -->
<div class="mt-12 flex gap-2">
<div class="w-8 h-1 bg-secondary-fixed rounded-full"></div>
<div class="w-2 h-1 bg-surface-variant rounded-full"></div>
<div class="w-2 h-1 bg-surface-variant rounded-full"></div>
</div>
</div>
<!-- Ambient Background Pulse (Subtle Glow) -->
<div class="absolute bottom-[-10%] left-[-10%] w-[40%] h-[40%] bg-secondary-fixed/5 rounded-full blur-[120px] pointer-events-none"></div>
<div class="absolute top-[20%] right-[-5%] w-[30%] h-[30%] bg-primary/5 rounded-full blur-[100px] pointer-events-none"></div>
</main>
<script>
        // Subtle micro-interaction: slow zoom on hero image
        window.addEventListener('load', () => {
            const hero = document.getElementById('heroImage');
            if (hero) {
                hero.style.transform = 'scale(1.15)';
            }
        });

        // Simple onboarding transition simulation
        function startOnboarding() {
            const main = document.querySelector('main');
            main.style.transition = 'opacity 0.6s ease-out';
            main.style.opacity = '0';
            setTimeout(() => {
                // In a real app, this would navigate to the next screen
                alert('Initializing charging network access...');
                main.style.opacity = '1';
            }, 700);
        }

        // Vanilla micro-interactions for button hover
        const btn = document.querySelector('button');
        btn.addEventListener('mousemove', (e) => {
            const rect = btn.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            btn.style.setProperty('--x', `${x}px`);
            btn.style.setProperty('--y', `${y}px`);
        });
    </script>
