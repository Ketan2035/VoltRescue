<script>
        // Simple Interaction logic for demo
        document.addEventListener('DOMContentLoaded', () => {
            const markers = document.querySelectorAll('#map-markers > div');
            markers.forEach(marker => {
                marker.addEventListener('mouseenter', () => {
                    marker.style.zIndex = "30";
                });
                marker.addEventListener('mouseleave', () => {
                    marker.style.zIndex = "10";
                });
            });

            // Smoothly move markers to simulate live tracking
            setInterval(() => {
                const vans = document.querySelectorAll('.pointer-events-auto.group');
                vans.forEach(van => {
                    const currentTop = parseFloat(van.style.top);
                    const currentLeft = parseFloat(van.style.left);
                    van.style.transition = "all 2s linear";
                    van.style.top = (currentTop + (Math.random() * 0.4 - 0.2)) + "%";
                    van.style.left = (currentLeft + (Math.random() * 0.4 - 0.2)) + "%";
                });
            }, 3000);
        });
    </script>
